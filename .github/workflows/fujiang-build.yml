name: Fujiang Signed APK Build

on:
  workflow_dispatch:
  push:
    branches: [ main, develop ]
    paths:
      - 'Monica for Android/**/*.kt'
      - 'Monica for Android/**/*.java'
      - 'Monica for Android/**/*.gradle'
      - 'Monica for Android/**/*.kts'
      - '.github/workflows/fujiang-build.yml'

permissions:
  contents: write

jobs:
  build:
    name: Build Signed Release APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "Monica for Android"
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Set up Rust Android toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-linux-android armv7-linux-androideabi
          cargo install cargo-ndk --version 4.1.2 --locked

      - name: Build Rust JNI for release ABIs
        shell: bash
        run: |
          (
            cd rust-jni
            cargo ndk \
              -t arm64-v8a \
              -t armeabi-v7a \
              -o ../app/src/main/jniLibs \
              build --release
          )
          test -f app/src/main/jniLibs/arm64-v8a/libmonica_rust_jni.so
          test -f app/src/main/jniLibs/armeabi-v7a/libmonica_rust_jni.so

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Prepare signing keystore
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" ]; then
            # 仓库自带签名：直接用原项目 secrets 里的 keystore（自身签名）
            echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > "$GITHUB_WORKSPACE/release.jks"
            echo "KEYSTORE_FILE=$GITHUB_WORKSPACE/release.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASS=${{ secrets.DEBUG_STORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=${{ secrets.DEBUG_KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "KEY_PASS=${{ secrets.DEBUG_KEY_PASSWORD }}" >> "$GITHUB_ENV"
            echo "Using repository keystore (self signing)"
          else
            # fork 无 secrets 时：生成自签名 keystore 保证出包
            keytool -genkeypair -v \
              -keystore "$GITHUB_WORKSPACE/release.jks" \
              -alias fujiang \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass fujiang123 \
              -keypass fujiang123 \
              -dname "CN=Fujiang, OU=Monica, O=Monica, L=City, ST=State, C=CN"
            echo "KEYSTORE_FILE=$GITHUB_WORKSPACE/release.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASS=fujiang123" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=fujiang" >> "$GITHUB_ENV"
            echo "KEY_PASS=fujiang123" >> "$GITHUB_ENV"
            echo "Generated self-signed keystore"
          fi

      - name: Build signed Release APK
        shell: bash
        run: |
          ./gradlew :app:assembleRelease --stacktrace \
            -Pandroid.injected.signing.store.file=$KEYSTORE_FILE \
            -Pandroid.injected.signing.store.password=$KEYSTORE_PASS \
            -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$KEY_PASS

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          apks="$(find app/build/outputs/apk -type f -iname '*.apk' | sort)"
          test -n "$apks"
          arm64_found=0
          armv7_found=0
          for apk in $apks; do
            entries="$(unzip -Z1 "$apk" || true)"
            case "$entries" in
              *'lib/arm64-v8a/libmonica_rust_jni.so'*) arm64_found=1 ;;
            esac
            case "$entries" in
              *'lib/armeabi-v7a/libmonica_rust_jni.so'*) armv7_found=1 ;;
            esac
          done
          test "$arm64_found" -eq 1
          test "$armv7_found" -eq 1
          echo "APK generated:"
          ls -la app/build/outputs/apk/release/

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: fujiang-signed-apk
          path: |
            Monica for Android/app/build/outputs/apk/release/*.apk